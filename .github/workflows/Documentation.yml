name: Documentation

on:
  push:
    branches:
      - main
      - 'release-'
    tags: '*'
  pull_request:
  schedule:
    - cron: '9 16 * * 3'

jobs:
  build:
    name: "Documentation"
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    with:
      julia-version: "1.11"  # Pinned due to Julia 1.12 compatibility issues in upstream packages
    secrets: "inherit"
